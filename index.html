<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Proxy</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000;
        }
        button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            z-index: 9999;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* Hidden until fullscreen is active */
        }
    </style>
</head>
<body>

    <button id="startBtn">Enter Fullscreen & Load Website</button>
    <iframe id="proxyFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

    <script>
        const btn = document.getElementById('startBtn');
        const frame = document.getElementById('proxyFrame');
        
        // Define your target URL and the proxy you are using
        const targetUrl = "youtube.com"; 
        const proxyUrl = "croxyproxy.com"; // Replace with your proxy

        btn.addEventListener('click', async () => {
            try {
                // 1. Request Fullscreen for the browser window
                await document.documentElement.requestFullscreen();
                
                // 2. Load the proxied URL into the iframe
                frame.src = proxyUrl + encodeURIComponent(targetUrl);
                frame.style.display = 'block';
                
                // 3. Hide the button
                btn.style.display = 'none';
            } catch (err) {
                console.error("Error attempting to enable fullscreen:", err);
            }
        });
    </script>
</body>
</html>
